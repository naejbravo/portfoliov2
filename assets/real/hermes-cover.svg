<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="hermesGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- connections -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <path d="M320 180 L140 80"/>
    <path d="M320 180 L500 80"/>
    <path d="M320 180 L140 280"/>
    <path d="M320 180 L500 280"/>
  </g>

  <!-- satellite nodes -->
  <g>
    <rect x="60" y="52" width="160" height="56" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="140" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">Mem0 + Qdrant</text>
    <text x="140" y="94" text-anchor="middle" font-size="11" fill="#94a3b8">semantic memory</text>

    <rect x="420" y="52" width="160" height="56" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="500" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">OpenRouter</text>
    <text x="500" y="94" text-anchor="middle" font-size="11" fill="#94a3b8">~20 LLM providers</text>

    <rect x="60" y="252" width="160" height="56" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="140" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">Browser Use</text>
    <text x="140" y="294" text-anchor="middle" font-size="11" fill="#94a3b8">web automation</text>

    <rect x="420" y="252" width="160" height="56" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="500" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">Telegram · Slack</text>
    <text x="500" y="294" text-anchor="middle" font-size="11" fill="#94a3b8">messaging gateway</text>
  </g>

  <!-- central node -->
  <rect x="230" y="140" width="180" height="80" rx="16" fill="url(#hermesGrad)"/>
  <text x="320" y="175" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Hermes</text>
  <text x="320" y="198" text-anchor="middle" font-size="12" fill="#dbeafe">agent · OCI ARM64 · Docker</text>
</svg>
